name: Publish Release

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    branches: [main]
    types: [completed]

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
    outputs:
      should-publish: ${{ steps.release-pr.outputs.should-publish }}

    steps:
      - name: Verify successful Pages deploy job for the exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          jobs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100")"

          deploy_count="$(jq '[.jobs[] | select(.name == "deploy")] | length' <<<"$jobs")"
          if [[ "$deploy_count" != "1" ]]; then
            echo "Expected exactly one deploy job; found ${deploy_count}." >&2
            exit 1
          fi

          if ! jq -e --arg sha "$EXPECTED_SHA" '
            .jobs[]
            | select(.name == "deploy")
            | .status == "completed"
              and .conclusion == "success"
              and .head_sha == $sha
          ' <<<"$jobs" >/dev/null; then
            echo "The deploy job did not complete successfully for ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Classify main deployment and verify pending Release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_HEAD: release-please--branches--main--components--plan-measure
        run: |
          set -euo pipefail

          # REST 2026-03-10 removes merge_commit_sha from pull request responses.
          release_prs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" \
            | jq -s \
                --arg sha "$EXPECTED_SHA" \
                --arg head "$EXPECTED_HEAD" '
                  add
                  | [
                      .[]
                      | select(
                          .merged_at != null
                          and .base.ref == "main"
                          and .head.ref == $head
                          and .merge_commit_sha == $sha
                          and (.labels | any(.name == "autorelease: pending"))
                        )
                    ]
                ')"

          release_pr_count="$(jq 'length' <<<"$release_prs")"
          if [[ "$release_pr_count" == "0" ]]; then
            echo "No pending Release Please PR matches ${EXPECTED_SHA}; skipping publication."
            echo "should-publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$release_pr_count" != "1" ]]; then
            echo "Expected exactly one pending Release Please PR for ${EXPECTED_SHA}; found ${release_pr_count}." >&2
            exit 1
          fi

          release_pr_number="$(jq -r '.[0].number' <<<"$release_prs")"
          echo "Validated Release PR #${release_pr_number} for ${EXPECTED_SHA}."
          echo "should-publish=true" >>"$GITHUB_OUTPUT"

  publish:
    needs: preflight
    if: ${{ needs.preflight.outputs.should-publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Create tag and GitHub Release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
