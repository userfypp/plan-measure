name: Publish Release

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    # Serialize only the mutating job, not the caller's entire CI run.
    concurrency:
      group: release-please-main
      cancel-in-progress: false
      queue: max
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact validated and deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Publish the exact release and reconcile labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-release.mjs
