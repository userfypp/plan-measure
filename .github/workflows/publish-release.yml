name: Publish Release

on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    branches: [main]
    types: [completed]

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
    outputs:
      should-publish: ${{ steps.release-pr.outputs.should-publish }}

    steps:
      - name: Verify successful Pages deploy job for the exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          jobs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100")"

          deploy_count="$(jq '[.jobs[] | select(.name == "deploy")] | length' <<<"$jobs")"
          if [[ "$deploy_count" != "1" ]]; then
            echo "Expected exactly one deploy job; found ${deploy_count}." >&2
            exit 1
          fi

          if ! jq -e --arg sha "$EXPECTED_SHA" '
            .jobs[]
            | select(.name == "deploy")
            | .status == "completed"
              and .conclusion == "success"
              and .head_sha == $sha
          ' <<<"$jobs" >/dev/null; then
            echo "The deploy job did not complete successfully for ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Classify main deployment and verify pending Release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_HEAD: release-please--branches--main--components--plan-measure
        run: |
          set -euo pipefail

          associated_prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/pulls?per_page=100")"

          release_branch_prs="$(jq \
            --arg sha "$EXPECTED_SHA" \
            --arg head "$EXPECTED_HEAD" '
              [
                .[]
                | select(
                    .merged_at != null
                    and .base.ref == "main"
                    and .merge_commit_sha == $sha
                    and .head.ref == $head
                  )
              ]
            ' <<<"$associated_prs")"

          release_branch_count="$(jq 'length' <<<"$release_branch_prs")"
          if [[ "$release_branch_count" == "0" ]]; then
            echo "No Release Please PR is associated with ${EXPECTED_SHA}; skipping publication."
            echo "should-publish=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$release_branch_count" != "1" ]]; then
            echo "Expected exactly one Release Please PR for ${EXPECTED_SHA}; found ${release_branch_count}." >&2
            exit 1
          fi

          if ! jq -e '
            .[0].labels
            | any(.name == "autorelease: pending")
          ' <<<"$release_branch_prs" >/dev/null; then
            echo "The Release Please PR associated with ${EXPECTED_SHA} is missing autorelease: pending." >&2
            exit 1
          fi

          release_pr_number="$(jq -r '.[0].number' <<<"$release_branch_prs")"

          pending_prs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" \
            | jq -s '
                add
                | [
                    .[]
                    | select(
                        .merged_at != null
                        and (.labels | any(.name == "autorelease: pending"))
                      )
                  ]
              ')"

          pending_count="$(jq 'length' <<<"$pending_prs")"
          if [[ "$pending_count" != "1" ]]; then
            echo "Expected exactly one merged PR on main with autorelease: pending; found ${pending_count}." >&2
            exit 1
          fi

          if ! jq -e \
            --argjson number "$release_pr_number" \
            --arg sha "$EXPECTED_SHA" \
            --arg head "$EXPECTED_HEAD" '
              .[0].number == $number
              and .[0].merge_commit_sha == $sha
              and .[0].head.ref == $head
              and .[0].base.ref == "main"
            ' <<<"$pending_prs" >/dev/null; then
            echo "The unique pending Release PR does not match ${EXPECTED_SHA}." >&2
            exit 1
          fi

          echo "Validated Release PR #${release_pr_number} for ${EXPECTED_SHA}."
          echo "should-publish=true" >>"$GITHUB_OUTPUT"

  publish:
    needs: preflight
    if: ${{ needs.preflight.outputs.should-publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Create tag and GitHub Release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
