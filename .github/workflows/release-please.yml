name: Release Please

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Next release version. keep reuses the choice saved on the open release PR, auto follows
          Conventional Commits, and patch, minor or major force that bump until the release ships.
        type: choice
        default: keep
        options: [keep, auto, patch, minor, major]

permissions:
  contents: read

jobs:
  release-please:
    # Serialize only the mutating job, not the caller's entire CI run.
    concurrency:
      group: release-please-main
      cancel-in-progress: false
      queue: max
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Release Please token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "RELEASE_PLEASE_TOKEN is required to create release PRs that trigger CI." >&2
            exit 1
          fi

      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # CI runs pass no input, which keeps the version saved on the release PR.
      - name: Resolve the next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_BUMP: ${{ inputs.version }}
        run: node .github/scripts/release-bump.mjs resolve

      - name: Create or update draft Release PR
        if: ${{ steps.version.outputs.release_as == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # The action ignores release-as in manifest mode, so a chosen version uses the CLI it bundles.
      # Installed from a lockfile without lifecycle scripts, in a step that has no token, so no
      # dependency code runs next to RELEASE_PLEASE_TOKEN.
      - name: Install the pinned Release Please CLI
        if: ${{ steps.version.outputs.release_as != '' }}
        run: npm ci --ignore-scripts --prefix .github/release-please-cli

      - name: Create or update draft Release PR with the chosen version
        if: ${{ steps.version.outputs.release_as != '' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_AS: ${{ steps.version.outputs.release_as }}
        run: >-
          .github/release-please-cli/node_modules/.bin/release-please release-pr
          --token "$RELEASE_TOKEN"
          --repo-url "$GITHUB_REPOSITORY"
          --target-branch main
          --config-file release-please-config.json
          --manifest-file .release-please-manifest.json
          --release-as "$RELEASE_AS"

      - name: Save the version choice on the Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_BUMP: ${{ inputs.version }}
        run: node .github/scripts/release-bump.mjs save
