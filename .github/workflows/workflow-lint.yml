name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - ".github/workflow-lint/**"
      - ".github/release-please-cli/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
      - ".github/workflow-lint/**"
      - ".github/release-please-cli/**"

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint-workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint

      # actionlint does not know the `queue` concurrency key yet; GitHub accepts it.
      - name: Run actionlint
        run: ./actionlint -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Use Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install zizmor
        run: python -m pip install --require-hashes --no-deps -r .github/workflow-lint/requirements.txt

      # Offline keeps the result deterministic; the config lists the one accepted finding.
      - name: Run zizmor
        run: zizmor --offline --min-severity medium .github/workflows

  # The Release Please CLI is installed from its lockfile only when a version is chosen by hand,
  # so a broken lockfile would otherwise surface during a release.
  release-cli:
    name: release-please-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the pinned Release Please CLI
        run: npm ci --ignore-scripts --prefix .github/release-please-cli

      - name: Check the installed version matches the pin
        run: |
          set -euo pipefail
          pinned="$(node -p "require('./.github/release-please-cli/package.json').dependencies['release-please']")"
          installed="$(.github/release-please-cli/node_modules/.bin/release-please --version)"
          [ "$pinned" = "$installed" ] || { echo "Pinned $pinned but installed $installed." >&2; exit 1; }
