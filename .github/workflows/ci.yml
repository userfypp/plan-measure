name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate pull request title
        if: ${{ github.event_name == 'pull_request' }}
        run: node .github/scripts/check-pr-title.mjs

      - name: Test release automation
        run: node --test .github/scripts/*.test-node.mjs

      - name: Validate release metadata and preview notes
        run: node .github/scripts/preview-release-notes.mjs

      - name: Validate React stack
        run: node .github/scripts/check-react-stack.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      # Reported only: no coverage threshold fails CI.
      - name: Report coverage
        run: node .github/scripts/coverage-summary.mjs

      - name: Build
        run: npm run build

  # Opens the built app in Chromium: the start screen and the sample project must load without
  # page or console errors. Then drives it with the keyboard in Chromium and WebKit (Safari's
  # engine): Tab must behave the same in both.
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            perf/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix perf

      - name: Install Chromium and WebKit
        run: ./perf/node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run test:smoke

      - name: Keyboard navigation test
        run: npm run test:keyboard

  pages:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  publish-release:
    needs: [verify, pages]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/publish-release.yml

  release-please:
    needs: publish-release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-please.yml
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
