name: Performance

on:
  pull_request:
    # labeled/unlabeled re-run the size check when a label changes; edited covers a new base.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Reads the pull request's current labels, so a re-run sees the label as it is now.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; depth 2 brings its first parent, the base.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check size
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run perf:size
      - name: Check size against the base
        # Includes the checks of perf:size and adds the growth allowance and the approval label.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          parents="$(git rev-list --parents -n 1 HEAD)"
          if [ "$(wc -w <<<"$parents")" -ne 3 ]; then
            echo "Expected the pull request merge commit; got: $parents" >&2
            exit 1
          fi
          # Not the event payload: a re-run replays the labels the pull request had when it was triggered.
          labels="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.labels[].name')"
          approval=()
          if grep -qxF 'size: approved' <<<"$labels"; then approval=(--approved); fi
          npm run perf:size:diff -- --base HEAD^1 "${approval[@]}"
      - if: ${{ !cancelled() }}
        run: npm run perf:selftest

  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            perf/package-lock.json
      - name: Warn about runner noise
        run: echo '::warning::Shared runners are noisy. Confirm any e2e failure on the same machine, and never update the baseline automatically.'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix perf
      - run: ./perf/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run build
      - name: Run the benchmark in normal mode (scheduled and manual runs; never updates the baseline)
        run: npm run perf:e2e
      - name: Print metrics for diagnosis
        if: always()
        run: |
          if [ -f perf/results/latest.json ]; then
            node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("perf/results/latest.json")); console.log(JSON.stringify({browser:r.browser,scenarios:r.scenarios},null,2));'
          fi
