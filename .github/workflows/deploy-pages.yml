name: Deploy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      should-deploy: ${{ steps.plan.outputs.should-deploy }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Prevent Pages rollback on old reruns
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/plan-pages-deployment.mjs

      - name: Install dependencies
        if: ${{ steps.plan.outputs.should-deploy == 'true' }}
        run: npm ci

      - name: Build
        if: ${{ steps.plan.outputs.should-deploy == 'true' }}
        run: npm run build

      - name: Configure GitHub Pages
        if: ${{ steps.plan.outputs.should-deploy == 'true' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        if: ${{ steps.plan.outputs.should-deploy == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: ${{ needs.build.outputs.should-deploy == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
