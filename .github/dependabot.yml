version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid

    open-pull-requests-limit: 5

    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      automerge-react-patches:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - react-konva
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - patch

      react-minor-major:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - react-konva
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - major

      automerge-development-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
        dependency-type: development
        update-types:
          - minor
          - patch

      automerge-production-patches:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - react
          - react-dom
          - react-konva
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Madrid

    open-pull-requests-limit: 2

    groups:
      github-actions-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
