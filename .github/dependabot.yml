version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid

    open-pull-requests-limit: 5

    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      automerge-react-patches:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
          - react-konva
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - patch

      automerge-development-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
        dependency-type: development
        update-types:
          - minor
          - patch

      automerge-production-patches:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - react
          - react-dom
          - react-konva
        dependency-type: production
        update-types:
          - patch

    ignore:
      - dependency-name: react
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-konva
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Madrid

    open-pull-requests-limit: 2

    cooldown:
      default-days: 7

    groups:
      github-actions-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /.github/workflow-lint
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Madrid

    open-pull-requests-limit: 1

    cooldown:
      semver-minor-days: 7
      semver-patch-days: 3

  # Manual-merge entries: no group starts with "automerge", so the auto-merge workflow ignores them.
  - package-ecosystem: npm
    directory: /perf
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Madrid

    open-pull-requests-limit: 1

    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  - package-ecosystem: npm
    directory: /.github/release-please-cli
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid

    open-pull-requests-limit: 1

    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
