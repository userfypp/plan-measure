name: Feature request
description: Suggest an improvement to Plan Measure
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the limitation or workflow that needs improvement.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you change?
      description: Describe the result or behavior you would like.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add examples, screenshots, alternatives, or other useful context.
