name: Feature request
description: Suggest an improvement to Plan Measure
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like to improve?
      description: Describe the problem or idea, and how you think it should work.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Add examples, screenshots, alternatives, or other context if useful.
