name: Bug report
description: Report something that is not working correctly
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what is wrong and, if useful, how to reproduce it.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and system
      placeholder: Chrome, macOS
