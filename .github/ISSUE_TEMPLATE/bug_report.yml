name: Bug report
description: Report something that is not working correctly
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the shortest steps you know.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and system
      placeholder: Safari 18, macOS 15
