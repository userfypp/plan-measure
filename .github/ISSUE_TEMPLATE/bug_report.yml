name: Bug report
description: Report a reproducible problem in Plan Measure
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Plan Measure. Please avoid sharing confidential plan files.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that triggers the problem.
      placeholder: |
        1. Open ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include browser, OS, and app version or commit when relevant.
      placeholder: Safari 18, macOS 15, Plan Measure 1.1.0
    validations:
      required: true
